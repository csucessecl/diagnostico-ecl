<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000508">
<title>Recomendações Ecossistema do Lucro</title>
<link rel="icon" type="image/svg+xml" href="assets/img/brasao-claro.svg">
<style>
@font-face { font-family: "Host Grotesk"; src: url(assets/fonts/HostGrotesk-Variable.woff2) format("woff2"); font-weight: 300 800; font-display: swap; }
@font-face { font-family: "Anisette"; src: url(assets/fonts/Anisette-Regular.woff2) format("woff2"); font-display: swap; }
:root {
  --ecl-abismo: #050A10; --ecl-grafite: #131C25; --ecl-nevoa: #F9FAFB; --ecl-aco: #9EA6AD;
  --ecl-azul-botao: #0B72C7; --ecl-azul-claro: #4C9EEB; --ecl-fio: rgba(210, 215, 218, 0.16);
  --ecl-font-texto: "Host Grotesk", "Helvetica Neue", Arial, sans-serif;
  --ecl-font-rotulo: "Anisette", "Host Grotesk", "Helvetica Neue", Arial, sans-serif;
  --ecl-grad-domo: radial-gradient(120% 90% at 50% 0%, rgba(8,110,193,.55) 0%, rgba(8,110,193,.18) 45%, rgba(5,10,16,0) 75%);
  --ecl-glow-cta: inset 0 1px 0 rgba(255,255,255,.28), 0 0 36px rgba(11,114,199,.6), 0 0 8px rgba(76,158,235,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: var(--ecl-grad-domo), var(--ecl-abismo); color: var(--ecl-nevoa);
  font-family: var(--ecl-font-texto);
}
form { width: 100%; max-width: 360px; display: grid; gap: 18px; justify-items: center; text-align: center; }
form img { width: 64px; height: auto; margin-bottom: 8px; }
.rotulo { font-family: var(--ecl-font-rotulo); letter-spacing: .14em; font-size: 13px; color: var(--ecl-azul-claro); }
h1 { margin: 0; font-weight: 500; font-size: 22px; line-height: 1.25; }
input {
  width: 100%; padding: 14px 18px; border-radius: 999px; border: 1px solid var(--ecl-fio);
  background: var(--ecl-grafite); color: var(--ecl-nevoa); font: inherit; font-size: 16px; text-align: center;
}
input:focus { outline: 2px solid var(--ecl-azul-claro); outline-offset: 2px; }
button {
  width: 100%; padding: 14px 18px; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--ecl-azul-botao); box-shadow: var(--ecl-glow-cta); color: var(--ecl-nevoa);
  font: inherit; font-size: 16px; font-weight: 600;
}
button:disabled { opacity: .6; cursor: progress; }
.erro { min-height: 1.4em; margin: 0; color: var(--ecl-aco); font-size: 14px; }
</style>
</head>
<body>
<form id="portao" hidden>
  <img src="assets/img/brasao-claro.svg" alt="Brasão Ecossistema do Lucro">
  <span class="rotulo">ACESSO RESTRITO</span>
  <h1>Recomendações Ecossistema do Lucro</h1>
  <input id="senha" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required>
  <button id="entrar" type="submit">Entrar</button>
  <p class="erro" id="erro" role="alert"></p>
</form>

  var CHAVE = "ecl-chave:" + "FRL5qE7fKjiLg50bdGCQug==";
  var sub = window.crypto && crypto.subtle;
  var form = document.getElementById("portao"), campo = document.getElementById("senha");
  var botao = document.getElementById("entrar"), erro = document.getElementById("erro");

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function paraHex(u) { return Array.prototype.map.call(u, function (x) { return ("0" + x.toString(16)).slice(-2); }).join(""); }
  function deHex(h) { var u = new Uint8Array(h.length / 2); for (var i = 0; i < u.length; i++) u[i] = parseInt(h.substr(i * 2, 2), 16); return u; }

  function le() { try { return sessionStorage.getItem(CHAVE); } catch (e) { return null; } }
  function esquece() { try { sessionStorage.removeItem(CHAVE); } catch (e) {} }

  async function derivar(senha) {

  async function abrir(bruta) {

    if (location.hash) setTimeout(function () {
      var alvo = document.getElementById(decodeURIComponent(location.hash.slice(1)));
      if (alvo) alvo.scrollIntoView();

    return true;
  }

  function mostra() { form.hidden = false; campo.focus(); }
